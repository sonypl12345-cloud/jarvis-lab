name: PostgreSQL atomic transaction lab
on:
  push:
    branches: ['lab/pg-atomic-20261127']
permissions: {}
jobs:
  atomic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lab
          POSTGRES_PASSWORD: local-fixture-only
          POSTGRES_DB: lab
        options: >-
          --health-cmd "pg_isready -U lab -d lab"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Synthetic transaction tests
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        shell: bash
        run: |
          set -euo pipefail
          db() { docker exec -i "$PG_CONTAINER" psql -X -qAt -v ON_ERROR_STOP=1 -U lab -d lab "$@"; }
          query() { db -c "$1"; }
          check() {
            local label="$1" sql="$2" expected="$3" actual
            actual=$(query "$sql")
            if [[ "$actual" != "$expected" ]]; then echo "FAIL: $label expected=$expected actual=$actual"; exit 1; fi
            echo "PASS: $label"
          }
          db <<'SQL'
          CREATE TABLE prior (id integer PRIMARY KEY, device text NOT NULL, uses integer NOT NULL DEFAULT 0);
          INSERT INTO prior(id,device) VALUES (1,'fixture-a'),(2,'fixture-b');
          CREATE TABLE receipt (
            final_id integer PRIMARY KEY,
            prior_id integer NOT NULL REFERENCES prior(id),
            device text NOT NULL,
            first_id integer NOT NULL,
            CHECK(first_id<>final_id)
          );
          CREATE FUNCTION admit(f integer,p integer,d text,s integer, authorized boolean)
          RETURNS text LANGUAGE plpgsql AS $$
          DECLARE r receipt%ROWTYPE; n integer;
          BEGIN
            IF authorized IS DISTINCT FROM true OR f IS NULL OR p IS NULL OR d IS NULL OR s IS NULL OR f=s THEN
              RETURN 'REJECT';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM prior WHERE id=p AND device=d) THEN
              RETURN 'REJECT';
            END IF;
            INSERT INTO receipt VALUES(f,p,d,s) ON CONFLICT(final_id) DO NOTHING;
            GET DIAGNOSTICS n=ROW_COUNT;
            IF n=1 THEN
              UPDATE prior SET uses=uses+1 WHERE id=p;
              RETURN 'RECORDED';
            END IF;
            SELECT * INTO r FROM receipt WHERE final_id=f;
            IF FOUND AND r.prior_id=p AND r.device=d AND r.first_id=s THEN RETURN 'REPLAY'; END IF;
            RETURN 'CONFLICT';
          END $$;
          SQL
          check version "SELECT current_setting('server_version_num')::int/10000" 17
          check initial "SELECT admit(100,1,'fixture-a',10,true)" RECORDED
          check repeat "SELECT admit(100,1,'fixture-a',10,true)" REPLAY
          check changed_source "SELECT admit(100,1,'fixture-a',11,true)" CONFLICT
          check different_prior "SELECT admit(100,2,'fixture-b',10,true)" CONFLICT
          check wrong_device "SELECT admit(101,1,'fixture-b',10,true)" REJECT
          check unauthorized "SELECT admit(101,1,'fixture-a',10,false)" REJECT
          check same_step "SELECT admit(101,1,'fixture-a',101,true)" REJECT
          db <<'SQL'
          BEGIN;
          SELECT admit(102,1,'fixture-a',10,true);
          ROLLBACK;
          SQL
          check rollback "SELECT count(*) FROM receipt WHERE final_id=102" 0
          check rollback_count "SELECT uses FROM prior WHERE id=1" 1
          check retry "SELECT admit(102,1,'fixture-a',10,true)" RECORDED
          temp=$(mktemp -d)
          trap 'rm -rf "$temp"' EXIT
          # Hold an uncommitted receipt and prove a different session waits on it.
          ( docker exec -i -e PGAPPNAME=fixture_a "$PG_CONTAINER" psql -X -qAt -v ON_ERROR_STOP=1 -U lab -d lab -c "BEGIN; SELECT admit(200,1,'fixture-a',20,true); SELECT pg_sleep(5); COMMIT;" >"$temp/a" ) &
          a=$!
          ready=0
          for i in {1..30}; do
            if [[ $(query "SELECT count(*) FROM pg_stat_activity WHERE application_name='fixture_a' AND wait_event='PgSleep'") == 1 ]]; then ready=1; break; fi
            sleep .1
          done
          test "$ready" = 1
          ( docker exec -i -e PGAPPNAME=fixture_b "$PG_CONTAINER" psql -X -qAt -v ON_ERROR_STOP=1 -U lab -d lab -c "SELECT admit(200,1,'fixture-a',20,true)" >"$temp/b" ) &
          b=$!
          overlap=0
          for i in {1..30}; do
            if [[ $(query "SELECT count(*) FROM pg_stat_activity WHERE application_name='fixture_b' AND wait_event_type='Lock'") == 1 ]]; then overlap=1; break; fi
            sleep .1
          done
          wait "$a"; wait "$b"
          test "$overlap" = 1
          grep -Fx RECORDED "$temp/a"; grep -Fx REPLAY "$temp/b"
          echo "PASS: two-session lock overlap"
          pids=()
          for i in {1..16}; do ( query "SELECT admit(300,1,'fixture-a',30,true)" >"$temp/same-$i" ) & pids+=("$!"); done
          for pid in "${pids[@]}"; do wait "$pid"; done
          test "$(grep -hxc RECORDED "$temp"/same-* | awk '{s+=$1} END{print s}')" = 1
          test "$(grep -hxc REPLAY "$temp"/same-* | awk '{s+=$1} END{print s}')" = 15
          echo "PASS: 16 concurrent identical submissions"
          pids=()
          for i in {1..16}; do ( query "SELECT admit($((400+i)),1,'fixture-a',40,true)" >"$temp/distinct-$i" ) & pids+=("$!"); done
          for pid in "${pids[@]}"; do wait "$pid"; done
          test "$(grep -hxc RECORDED "$temp"/distinct-* | awk '{s+=$1} END{print s}')" = 16
          echo "PASS: 16 distinct concurrent submissions"
          check final_consistency "SELECT (SELECT count(*) FROM receipt)=(SELECT sum(uses) FROM prior)" t
          check final_count "SELECT count(*) FROM receipt" 20
          echo "SYNTHETIC_LAB_PASS"

      - name: Synthetic source identity regression
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        shell: bash
        run: |
          set -euo pipefail
          db() { docker exec -i "$PG_CONTAINER" psql -X -qAt -v ON_ERROR_STOP=1 -U lab -d lab "$@"; }
          query() { db -c "$1"; }
          check() {
            local label="$1" sql="$2" expected="$3" actual
            actual=$(query "$sql")
            if [[ "$actual" != "$expected" ]]; then echo "FAIL: $label expected=$expected actual=$actual"; exit 1; fi
            echo "PASS: $label"
          }
          db <<'SQL'
          -- Abstract synthetic model; no application schema, real data or external connections.
          CREATE TABLE fixture_task (
            id integer PRIMARY KEY, eligible boolean NOT NULL, verified boolean NOT NULL,
            device text NOT NULL, first_id integer NOT NULL, final_id integer NOT NULL
          );
          CREATE TABLE fixture_history (
            id bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
            task_key integer UNIQUE, command_key integer UNIQUE,
            category text NOT NULL, device text NOT NULL,
            source_task integer, first_id integer,
            CHECK ((task_key IS NOT NULL AND command_key IS NULL) OR
                   (task_key IS NULL AND command_key IS NOT NULL))
          );
          INSERT INTO fixture_task VALUES
            (1,true,true,'a',10,11),(2,true,false,'a',12,13),
            (3,true,true,'a',14,15),(4,true,true,'a',16,17),
            (5,true,true,'a',18,19),(6,false,true,'a',20,21),
            (7,true,true,'a',22,23),(8,true,true,'a',24,23),
            (9,true,true,'a',25,26),(10,true,true,'a',27,28),
            (11,true,true,'a',29,30);
          INSERT INTO fixture_history(task_key,category,device) VALUES (4,'old','a');
          INSERT INTO fixture_history(command_key,category,device) VALUES (15,'single','a');
          CREATE FUNCTION save_sequence(t integer, ingress text) RETURNS text
          LANGUAGE plpgsql AS $$
          DECLARE v fixture_task%ROWTYPE; h fixture_history%ROWTYPE; n integer;
          BEGIN
            IF ingress IS NULL OR ingress NOT IN ('old_entry','new_entry') THEN RETURN 'REJECT'; END IF;
            SELECT * INTO v FROM fixture_task WHERE id=t FOR UPDATE;
            IF NOT FOUND OR NOT v.eligible OR NOT v.verified OR v.first_id=v.final_id THEN
              RETURN 'HOLD_EVIDENCE';
            END IF;
            -- Both entry points must cooperate; never fall back to a legacy write.
            IF EXISTS (SELECT 1 FROM fixture_history WHERE task_key=t) THEN RETURN 'HOLD_OLD'; END IF;
            INSERT INTO fixture_history(command_key,category,device,source_task,first_id)
              VALUES(v.final_id,'sequence',v.device,v.id,v.first_id)
              ON CONFLICT(command_key) DO NOTHING;
            GET DIAGNOSTICS n=ROW_COUNT;
            IF n=1 THEN RETURN 'RECORDED'; END IF;
            SELECT * INTO h FROM fixture_history WHERE command_key=v.final_id;
            IF FOUND AND h.category='sequence' AND h.device=v.device
               AND h.source_task=v.id AND h.first_id=v.first_id THEN RETURN 'REPLAY'; END IF;
            RETURN 'HOLD_CONFLICT';
          END $$;
          SQL
          check new_entry "SELECT save_sequence(1,'new_entry')" RECORDED
          check old_entry_replay "SELECT save_sequence(1,'old_entry')" REPLAY
          check no_legacy_fallback "SELECT count(*) FROM fixture_history WHERE task_key=1" 0
          check unverified "SELECT save_sequence(2,'old_entry')" HOLD_EVIDENCE
          check single_command_collision "SELECT save_sequence(3,'new_entry')" HOLD_CONFLICT
          check historical_legacy_collision "SELECT save_sequence(4,'new_entry')" HOLD_OLD
          check unrelated_scope "SELECT save_sequence(6,'old_entry')" HOLD_EVIDENCE
          check unknown_task "SELECT save_sequence(99,'old_entry')" HOLD_EVIDENCE
          check unknown_ingress "SELECT save_sequence(5,'other')" REJECT
          check different_execution "SELECT save_sequence(5,'old_entry')" RECORDED
          check shared_final_first "SELECT save_sequence(7,'new_entry')" RECORDED
          check shared_final_second "SELECT save_sequence(8,'old_entry')" HOLD_CONFLICT
          db <<'SQL'
          BEGIN;
          SELECT save_sequence(9,'old_entry');
          ROLLBACK;
          SQL
          check rollback "SELECT count(*) FROM fixture_history WHERE command_key=26" 0
          check after_rollback "SELECT save_sequence(9,'new_entry')" RECORDED
          temp=$(mktemp -d)
          trap 'rm -rf "$temp"' EXIT
          ( docker exec -i -e PGAPPNAME=identity_a "$PG_CONTAINER" psql -X -qAt -v ON_ERROR_STOP=1 -U lab -d lab -c "BEGIN; SELECT save_sequence(10,'old_entry'); SELECT pg_sleep(5); COMMIT;" >"$temp/a" ) &
          a=$!
          ready=0
          for i in {1..30}; do
            if [[ $(query "SELECT count(*) FROM pg_stat_activity WHERE application_name='identity_a' AND wait_event='PgSleep'") == 1 ]]; then ready=1; break; fi
            sleep .1
          done
          test "$ready" = 1
          ( docker exec -i -e PGAPPNAME=identity_b "$PG_CONTAINER" psql -X -qAt -v ON_ERROR_STOP=1 -U lab -d lab -c "SELECT save_sequence(10,'new_entry')" >"$temp/b" ) &
          b=$!
          overlap=0
          for i in {1..30}; do
            if [[ $(query "SELECT count(*) FROM pg_stat_activity WHERE application_name='identity_b' AND wait_event_type='Lock'") == 1 ]]; then overlap=1; break; fi
            sleep .1
          done
          wait "$a"; wait "$b"
          test "$overlap" = 1
          grep -Fx RECORDED "$temp/a"; grep -Fx REPLAY "$temp/b"
          echo "PASS: independent competing entry points"
          check one_canonical "SELECT count(*) FROM fixture_history WHERE command_key=28 OR task_key=10" 1
          check original_rows_preserved "SELECT count(*) FROM fixture_history WHERE (task_key=4 AND category='old') OR (command_key=15 AND category='single')" 2
          check no_rejected_rows "SELECT count(*) FROM fixture_history WHERE command_key IN(13,21,30)" 0
          # A noncooperating legacy writer is intentionally shown to bypass this policy:
          INSERT_SQL="INSERT INTO fixture_history(task_key,category,device) VALUES (1,'old','a')"
          query "$INSERT_SQL"
          check noncooperating_writer_limitation "SELECT count(*) FROM fixture_history WHERE task_key=1 OR command_key=11" 2
          echo "IDENTITY_MODEL_PASS_WITH_KNOWN_LIMITATION"

      - name: Joint guard and admission transaction regression
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        shell: bash
        run: |
          set -euo pipefail
          db() { docker exec -i "$PG_CONTAINER" psql -X -qAt -v ON_ERROR_STOP=1 -U lab -d lab "$@"; }
          query() { db -c "$1"; }
          check() {
            local label="$1" sql="$2" expected="$3" actual
            actual=$(query "$sql")
            if [[ "$actual" != "$expected" ]]; then echo "FAIL: $label expected=$expected actual=$actual"; exit 1; fi
            echo "PASS: $label"
          }
          db <<'SQL'
          -- Synthetic model of a cooperative privacy guard and atomic learner.
          -- Not application code; no real records, credentials, or external connections.
          CREATE TABLE joint_prior(id integer PRIMARY KEY, uses integer NOT NULL DEFAULT 0);
          INSERT INTO joint_prior VALUES(1,0),(2,0);
          CREATE TABLE joint_task(
            id integer PRIMARY KEY, protected boolean NOT NULL, verified boolean NOT NULL,
            evidence_ok boolean NOT NULL, status text NOT NULL,
            final_key integer NOT NULL, prior_key integer NOT NULL, raw text NOT NULL
          );
          INSERT INTO joint_task VALUES
            (1,true,true,true,'done',101,1,'SYNTHETIC_RAW'),
            (2,true,true,false,'done',102,1,'SYNTHETIC_RAW'),
            (3,true,true,true,'done',103,1,'SYNTHETIC_RAW'),
            (4,true,true,true,'done',104,1,'SYNTHETIC_RAW'),
            (5,false,true,true,'done',105,1,'ordinary'),
            (6,true,false,true,'done',106,1,'SYNTHETIC_RAW'),
            (7,true,true,true,'running',107,1,'SYNTHETIC_RAW'),
            (8,true,true,true,'done',108,2,'SYNTHETIC_RAW'),
            (9,true,true,true,'done',109,2,'SYNTHETIC_RAW'),
            (10,true,true,true,'done',110,2,'SYNTHETIC_RAW'),
            (11,true,true,true,'done',111,2,'SYNTHETIC_RAW'),
            (12,true,true,true,'done',112,2,'SYNTHETIC_RAW');
          CREATE TABLE joint_memory(
            task_key integer UNIQUE, final_key integer UNIQUE,
            prior_key integer, payload jsonb NOT NULL,
            CHECK ((task_key IS NOT NULL AND final_key IS NULL)
                 OR (task_key IS NULL AND final_key IS NOT NULL))
          );
          INSERT INTO joint_memory(task_key,payload) VALUES(3,'{"historical":true}');
          INSERT INTO joint_memory(final_key,payload) VALUES(104,'{"single":true}');
          CREATE FUNCTION legacy_save(t integer) RETURNS text LANGUAGE plpgsql AS $$
          DECLARE r joint_task%ROWTYPE;
          BEGIN
            SELECT * INTO r FROM joint_task WHERE id=t;
            IF NOT FOUND OR r.status<>'done' OR NOT r.verified THEN RETURN 'HOLD'; END IF;
            IF r.protected THEN RETURN 'SKIP_RAW'; END IF;
            INSERT INTO joint_memory(task_key,payload) VALUES(t,jsonb_build_object('raw',r.raw))
              ON CONFLICT(task_key) DO NOTHING;
            RETURN 'LEGACY';
          END $$;
          CREATE FUNCTION learn(t integer, inject_failure boolean DEFAULT false) RETURNS integer
          LANGUAGE plpgsql AS $$
          DECLARE n integer; bumped integer;
          BEGIN
            WITH pair AS MATERIALIZED (
              SELECT q.final_key,q.prior_key
              FROM joint_task q JOIN joint_prior p ON p.id=q.prior_key
              WHERE q.id=t AND q.protected AND q.verified AND q.evidence_ok AND q.status='done'
                AND NOT EXISTS (SELECT 1 FROM joint_memory m WHERE m.task_key=q.id OR m.final_key=q.final_key)
              FOR UPDATE OF p
            ), admitted AS (
              INSERT INTO joint_memory(final_key,prior_key,payload)
              SELECT final_key,prior_key,'{"verified":true,"sanitized":true}'::jsonb FROM pair
              ON CONFLICT(final_key) DO NOTHING RETURNING final_key
            ), increments AS (
              SELECT p.prior_key,count(*)::integer n FROM pair p JOIN admitted a USING(final_key) GROUP BY p.prior_key
            ), counted AS (
              UPDATE joint_prior p SET uses=p.uses+i.n FROM increments i WHERE p.id=i.prior_key RETURNING i.n
            )
            SELECT (SELECT count(*) FROM admitted),(SELECT coalesce(sum(n),0) FROM counted) INTO n,bumped;
            IF n<>bumped OR inject_failure THEN RAISE EXCEPTION 'fixture rollback'; END IF;
            RETURN n;
          END $$;
          SQL
          check guarded_legacy "SELECT legacy_save(1)" SKIP_RAW
          check invalid_proof_legacy "SELECT legacy_save(2)" SKIP_RAW
          check valid_learning "SELECT learn(1)" 1
          check replay "SELECT learn(1)" 0
          check reject_invalid_proof "SELECT learn(2)" 0
          check existing_legacy_hold "SELECT learn(3)" 0
          check existing_final_hold "SELECT learn(4)" 0
          check unrelated_legacy "SELECT legacy_save(5)" LEGACY
          check unverified_legacy "SELECT legacy_save(6)" HOLD
          check unverified_learner "SELECT learn(6)" 0
          check incomplete_learner "SELECT learn(7)" 0
          check incomplete_legacy "SELECT legacy_save(7)" HOLD
          check raw_not_copied "SELECT count(*) FROM joint_memory WHERE payload::text LIKE '%SYNTHETIC_RAW%'" 0
          check prior_count_initial "SELECT uses FROM joint_prior WHERE id=1" 1
          if query "SELECT learn(8,true)" >/dev/null 2>&1; then echo "FAIL: expected rollback"; exit 1; fi
          check exception_rollback_row "SELECT count(*) FROM joint_memory WHERE final_key=108" 0
          check exception_rollback_counter "SELECT uses FROM joint_prior WHERE id=2" 0
          check retry_after_exception "SELECT learn(8)" 1
          temp=$(mktemp -d)
          trap 'rm -rf "$temp"' EXIT
          ( docker exec -i -e PGAPPNAME=joint_a "$PG_CONTAINER" psql -X -qAt -v ON_ERROR_STOP=1 -U lab -d lab -c "BEGIN; SELECT learn(9); SELECT pg_sleep(5); COMMIT;" >"$temp/a" ) &
          a=$!
          ready=0
          for i in {1..30}; do
            if [[ $(query "SELECT count(*) FROM pg_stat_activity WHERE application_name='joint_a' AND wait_event='PgSleep'") == 1 ]]; then ready=1; break; fi
            sleep .1
          done
          test "$ready" = 1
          ( docker exec -i -e PGAPPNAME=joint_b "$PG_CONTAINER" psql -X -qAt -v ON_ERROR_STOP=1 -U lab -d lab -c "SELECT learn(9)" >"$temp/b" ) &
          b=$!
          overlap=0
          for i in {1..30}; do
            if [[ $(query "SELECT count(*) FROM pg_stat_activity WHERE application_name='joint_b' AND wait_event_type='Lock'") == 1 ]]; then overlap=1; break; fi
            sleep .1
          done
          test "$overlap" = 1
          check old_path_during_learner "SELECT legacy_save(9)" SKIP_RAW
          wait "$a"; wait "$b"
          grep -Fx 1 "$temp/a"; grep -Fx 0 "$temp/b"
          echo "PASS: actual independent learner lock overlap and replay"
          check single_admission "SELECT count(*) FROM joint_memory WHERE final_key=109 OR task_key=9" 1
          check exact_counter "SELECT uses FROM joint_prior WHERE id=2" 2
          # Two independent completions share the same prior counter.
          ( query "SELECT learn(10)" >"$temp/c" ) & c=$!
          ( query "SELECT learn(11)" >"$temp/d" ) & d=$!
          wait "$c"; wait "$d"
          grep -Fx 1 "$temp/c"; grep -Fx 1 "$temp/d"
          check shared_prior_counter "SELECT uses FROM joint_prior WHERE id=2" 4
          check global_counter_consistency "SELECT (SELECT sum(uses) FROM joint_prior)=(SELECT count(*) FROM joint_memory WHERE prior_key IS NOT NULL)" t
          check historical_preserved "SELECT count(*) FROM joint_memory WHERE (task_key=3 AND payload='{\"historical\":true}') OR (final_key=104 AND payload='{\"single\":true}')" 2
          # Explicit limitation: without immutable terminal state, a later modification
          # can invalidate an earlier admission. This is a diagnostic, not a safety pass.
          check terminal_initial_admission "SELECT learn(12)" 1
          query "UPDATE joint_task SET evidence_ok=false WHERE id=12"
          check terminal_mutability_limitation "SELECT count(*) FROM joint_memory m JOIN joint_task t USING(final_key) WHERE t.id=12 AND NOT t.evidence_ok" 1
          echo "JOINT_SYNTHETIC_PASS_WITH_TERMINAL_MUTABILITY_LIMITATION"
