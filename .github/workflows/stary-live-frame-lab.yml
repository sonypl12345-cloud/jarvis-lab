name: Stary Rynek Live Frame LAB

on:
  push:
    branches:
      - lab/camera-ahead-v01
    paths:
      - tools/stary_live_frame.py
      - .github/workflows/stary-live-frame-lab.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure ffmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
      - name: Capture one verified live HLS frame
        run: python tools/stary_live_frame.py
      - name: Upload ephemeral LAB frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stary-rynek-live-frame
          path: |
            data/stary_live_frame.jpg
            data/stary_live_frame.json
          if-no-files-found: error
          retention-days: 1
